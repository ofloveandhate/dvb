stops_to_monitor:
  - Pirnaischerplatz
  - Pragerstr
  - Altmarkt

row_height: 30                # pixels
num_rows_per_table: 6         # make additional columns when departures exceed this
num_stops_per_page: 1

consecutive_autorefresh_timeout_threshold: 10
refresh_interval: 60          # seconds
clear_interval: 120           # seconds

window_width: 550 # in pixels
window_height: 330  # PiTFT Plus': [0, 0, 480, 320] #https://www.adafruit.com/product/2441

window_loc_x: 0
window_loc_y: 0

mock_update: false

verbosity: 1

window_title: "DVB Local Stop Monitor"
num_departures_to_monitor: 12 


columns:
  - header: "#"
    width: 40
    getter: get_line
    alignment: center

  - header: ""
    width: 35
    getter: get_mode_emoji
    alignment: left

  - header: "Dest"
    width: 150
    getter: get_destination
    alignment: left



  - header: "t"
    width: 35
    getter: get_minutes
    alignment: right

