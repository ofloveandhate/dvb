dvb_client_name: "DVB Local Stop Monitor. silviana amethyst (amethyst@mpi-cbg.de)"

stops_to_monitor:
  - Pirnaischerplatz
  - Pragerstr
  - Altmarkt

row_height: 30                # pixels
num_rows_per_table: 6         # make additional columns when departures exceed this
num_stops_per_page: 1

consecutive_autorefresh_timeout_threshold: 10
refresh_interval: 60          # seconds
clear_interval: 120           # seconds

# the joy-it RB-TFT3.5 is exactly 480x320 physical pixels, so these numbers are the
# hardware itself, not sizes to be scaled to a screen.  pin the scaling off.
scale_with_screen_dpi: false

# room around the touch buttons.  8 would overflow this screen by a pixel; 6 fits.
button_margin: 6
button_spacing: 6

window_width: 480
window_height: 320
window_loc_x: 0
window_loc_y: 0
is_full_screen: true

mock_update: false
verbosity: 0

window_title: "DVB Local Stop Monitor"
num_departures_to_monitor: 12

css_file: "style_pitft.css"

# touch: read straight from the evdev node, bypassing libinput
is_touch: true
touch_device: /dev/input/event0
touch_raw_x_min: 345
touch_raw_x_max: 3716
touch_raw_y_min: 402
touch_raw_y_max: 3717

# backlight is GPIO 18, hardcoded in the .py (there is no sysfs backlight on this display)
use_backlight_control: true

column_group_spacing: 20

columns:
  - header: "#"
    width: 35
    getter: get_line
    alignment: center

  - header: "Dest"
    width: 140
    getter: get_destination
    alignment: left
    elide: true

  - header: "t"
    width: 30
    getter: get_minutes
    alignment: right

  # which way it leaves this stop; see direction_recompute_interval
  - header: ""
    width: 24
    getter: get_direction_arrow
    alignment: center
